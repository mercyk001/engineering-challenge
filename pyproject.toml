[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kenyalaw"
version = "0.1.0"
description = "Kenya Law web scraping challenge"
requires-python = ">=3.8"

dependencies = [
  "aiohttp",
  "beautifulsoup4",
  "lxml",
  "pandas",
  "typer",
  "python-docx",
  "pypdf",
  "elasticsearch",
  "tenacity",
  "tqdm"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
